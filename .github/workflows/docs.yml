name: Documentation

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxyfile if missing
        run: |
          if [ ! -f Doxyfile ]; then
            doxygen -g
          fi

      - name: Build Documentation
        run: doxygen Doxyfile
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build-docs

    runs-on: ubuntu-latest
    
    environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
          
    permissions:
          pages: write
          id-token: write
          
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
