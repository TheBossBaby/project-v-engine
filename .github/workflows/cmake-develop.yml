name: CMake (develop & feature)

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    branches: [ develop ]

env:
  BUILD_TYPE: Debug
  CMAKE_BUILD_PARALLEL_LEVEL: 4
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Build editor variant
      - name: Configure CMake (Editor)
        run: cmake -S . -B build-editor -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DPROJECTV_BUILD_EDITOR=ON

      - name: Build (Editor)
        run: cmake --build build-editor --config ${{ env.BUILD_TYPE }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

      # Build application variant
      - name: Configure CMake (Application)
        run: cmake -S . -B build-app -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DPROJECTV_BUILD_EDITOR=OFF

      - name: Build (Application)
        run: cmake --build build-app --config ${{ env.BUILD_TYPE }} --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}